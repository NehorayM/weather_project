apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-app-dashboard
  namespace: monitoring
  labels:
    # the grafana sidecar loads every ConfigMap carrying this label
    grafana_dashboard: "1"
data:
  weather-app.json: |
    {
      "title": "Weather App",
      "uid": "weather-app",
      "tags": [
        "weather"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods serving",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count by (environment) (up{job=\"weather-app\"} == 1)",
              "legendFormat": "{{environment}}",
              "instant": true
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Error rate (5xx %)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * sum by (environment) (rate(flask_http_request_total{status=~\"5..\"}[5m])) / sum by (environment) (rate(flask_http_request_total[5m]))",
              "legendFormat": "{{environment}}",
              "instant": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Running version",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 4
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "weather_app_info",
              "legendFormat": "{{version}} ({{environment}})",
              "instant": true
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Requests per second",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (environment) (rate(flask_http_request_total[5m]))",
              "legendFormat": "{{environment}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Latency p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum by (environment, le) (rate(flask_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{environment}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "bargauge",
          "title": "Top cities, last 24h",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(10, sum by (city) (increase(weather_city_lookups_total[24h])))",
              "legendFormat": "{{city}}",
              "instant": true
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "City lookups per minute",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum by (city) (rate(weather_city_lookups_total[5m])) * 60",
              "legendFormat": "{{city}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Slowest endpoints p95",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 24,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "topk(5, histogram_quantile(0.95, sum by (endpoint, le) (rate(flask_http_request_duration_seconds_bucket[5m]))))",
              "legendFormat": "{{endpoint}}"
            }
          ]
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      }
    }