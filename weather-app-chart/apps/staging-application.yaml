apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weather-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://10.0.3.92:8000/whetherappgroup/weather-app-chart.git
    targetRevision: main
    path: .
    helm:
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: weather-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
