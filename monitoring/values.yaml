# kube-prometheus-stack values for the weather project.
# applied by apps/monitoring-application.yaml through ArgoCD.

# ---------------------------------------------------------------- disabled
# EKS runs the control plane. these are unreachable and their default
# ServiceMonitors would show as permanently down
kubeControllerManager: { enabled: false }
kubeScheduler:         { enabled: false }
kubeEtcd:              { enabled: false }
# kube-proxy on EKS binds its metrics to 127.0.0.1
kubeProxy:             { enabled: false }

# ---------------------------------------------------------------- operator
prometheusOperator:
  # the admission webhooks need TLS certs generated by helm-hook jobs, which
  # ArgoCD runs as sync hooks and which leave a perpetual diff on the CRD
  # caBundle. off means no jobs, no diff, and two fewer pods on the node
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests: { cpu: 25m,  memory: 64Mi }
    limits:   { cpu: 200m, memory: 192Mi }

# ---------------------------------------------------------------- prometheus
prometheus:
  prometheusSpec:
    retention: 15d
    # hard stop before the volume fills. oldest blocks are dropped first
    retentionSize: 15GB

    # THE setting people miss. at the default, prometheus only picks up
    # ServiceMonitors, PodMonitors and PrometheusRules carrying the release
    # label. false makes a nil selector match everything in the cluster
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues:     false
    ruleSelectorNilUsesHelmValues:           false
    probeSelectorNilUsesHelmValues:          false
    scrapeConfigSelectorNilUsesHelmValues:   false

    resources:
      requests: { cpu: 150m, memory: 512Mi }
      limits:   { cpu: 800m, memory: 1200Mi }

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

# ---------------------------------------------------------------- alertmanager
alertmanager:
  # some chart versions pass the config through helm's own template engine,
  # which would eat the {{ }} in the slack title below. false guarantees the
  # config reaches alertmanager literally
  tplConfig: false

  alertmanagerSpec:
    # the slack webhook, created by terraform, never committed to git.
    # mounts at /etc/alertmanager/secrets/alertmanager-slack/
    secrets:
      - alertmanager-slack
    resources:
      requests: { cpu: 25m,  memory: 64Mi }
      limits:   { cpu: 150m, memory: 128Mi }
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

  config:
    global:
      resolve_timeout: 5m
      slack_api_url_file: /etc/alertmanager/secrets/alertmanager-slack/slack-url

    route:
      receiver: "null"
      group_by: [alertname, environment]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # the stack ships a permanent always-firing Watchdog. it proves the
        # pipeline works and must never reach slack. it hits the default
        # null receiver by matching nothing below
        # application alerts: everything the weather-app rule group emits
        - receiver: slack-devops
          matchers:
            - team = "weather"
        # platform alerts from the stack's own rules, critical only.
        # warnings on a single-node cluster are mostly noise
        - receiver: slack-devops
          matchers:
            - severity = "critical"
            - alertname != "Watchdog"

    receivers:
      - name: "null"
      - name: slack-devops
        slack_configs:
          - channel: "#devops-alerts"
            send_resolved: true
            title: '{{ .Status | toUpper }} — {{ .CommonLabels.alertname }} ({{ .CommonLabels.environment }})'
            text: >-
              {{ range .Alerts }}{{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}

# ---------------------------------------------------------------- grafana
grafana:
  adminPassword: s5168231

  # the chart ships a helm test pod. on a full node it sits Pending forever
  testFramework:
    enabled: false

  resources:
    requests: { cpu: 50m,  memory: 128Mi }
    limits:   { cpu: 300m, memory: 320Mi }

  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3
    accessModes: ["ReadWriteOnce"]
    size: 5Gi

  grafana.ini:
    server:
      # behind an ALB that terminated TLS, grafana must know its public URL or
      # it builds links and redirects from the pod address
      root_url: https://grafana.nehorai-menashe.click
    users:
      allow_sign_up: false

  # the sidecar watches for ConfigMaps carrying this label and loads them as
  # dashboards. monitoring/dashboards/ in this repo is where they live
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      # the first nine are shared across every member of the weather ingress
      # group and must match templates/ingress.yaml exactly. a mismatch on any
      # of them makes the controller refuse the whole group
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/group.name: weather
      alb.ingress.kubernetes.io/load-balancer-name: weather-k8s-alb
      alb.ingress.kubernetes.io/security-groups: sg-0f72f865f02b6724d
      alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-north-1:225317159123:certificate/5e4939fc-e667-41cc-a7cb-dd1a0a3f9db2
      # grafana answers this without authentication
      alb.ingress.kubernetes.io/healthcheck-path: /api/health
      # after weather 10, staging 20, dev 30, argocd 40
      alb.ingress.kubernetes.io/group.order: "50"
    hosts:
      - grafana.nehorai-menashe.click
    path: /
    pathType: Prefix

# ---------------------------------------------------------------- exporters
kube-state-metrics:
  resources:
    requests: { cpu: 25m,  memory: 64Mi }
    limits:   { cpu: 150m, memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 15m,  memory: 32Mi }
    limits:   { cpu: 100m, memory: 64Mi }

# ---------------------------------------------------------------- app alerts
# creates a PrometheusRule with the labels the operator expects. every rule
# carries team=weather, which is what routes it to slack above
additionalPrometheusRulesMap:
  weather-app:
    groups:
      - name: weather-app
        rules:
          - alert: WeatherAppDown
            expr: sum by (environment) (up{job="weather-app"}) == 0
            for: 2m
            labels: { severity: critical, team: weather }
            annotations:
              summary: "weather-app has no reachable pods in {{ $labels.environment }}"
              description: "Every target has been down for two minutes."

          # silence is not health. if discovery returns nothing, the rule
          # above cannot fire because there is no series left to evaluate
          - alert: WeatherAppNoTargets
            expr: absent(up{job="weather-app"})
            for: 5m
            labels: { severity: critical, team: weather }
            annotations:
              summary: "Prometheus has discovered no weather-app pods"
              description: "The ServiceMonitor is broken, or every pod is gone."

          # a ratio, not a count. ten errors a minute is catastrophic on a
          # quiet service and irrelevant on a busy one
          - alert: HighErrorRate
            expr: |
              sum by (environment) (rate(flask_http_request_total{status=~"5.."}[5m]))
              /
              sum by (environment) (rate(flask_http_request_total[5m])) > 0.05
            for: 10m
            labels: { severity: critical, team: weather }
            annotations:
              summary: "Over five percent server errors in {{ $labels.environment }}"
              description: "Currently {{ $value | humanizePercentage }}."

          # two seconds, not one. /<location> calls a translate API, a city
          # API and a weather API in sequence before it renders
          - alert: HighLatency
            expr: |
              histogram_quantile(0.95,
                sum by (environment, le) (rate(flask_http_request_duration_seconds_bucket[5m]))
              ) > 2
            for: 10m
            labels: { severity: warning, team: weather }
            annotations:
              summary: "p95 latency above two seconds in {{ $labels.environment }}"
              description: "Currently {{ $value }} seconds."

          - alert: ProdReplicasLow
            expr: count(up{job="weather-app", environment="prod"} == 1) < 2
            for: 5m
            labels: { severity: warning, team: weather }
            annotations:
              summary: "Production is running fewer than two pods"
              description: "Currently {{ $value }}."