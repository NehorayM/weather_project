services:
  flask-app-1:
    build: .
    container_name: flask-instance-1
    env_file:
      - .env
    restart: unless-stopped

  flask-app-2:
    build: .
    container_name: flask-instance-2
    env_file:
      - .env
    restart: unless-stopped

  nginx-lb:
    image: nginx:latest
    container_name: ngnix-lb-container
    ports:
      - "9090:9090"
    volumes:
       - ./nginx/default-load-balance.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask-app-1
      - flask-app-2
    restart: unless-stopped