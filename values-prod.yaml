# three replicas is what makes the rolling update observable - one is replaced
# while the other two keep serving
replicaCount: 3

image:
  # the pipeline rewrites this line on every build to main
  tag: "bootstrap"

ingress:
  host: weather.nehorai-menashe.click
  groupOrder: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  ENVIRONMENT: "production"
  LOG_LEVEL: "WARNING"
  APP_TITLE: "Weather App"
  BACKGROUND_COLOR: "#1B3A6B"
