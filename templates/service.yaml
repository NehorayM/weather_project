apiVersion: v1
kind: Service
metadata:
  # same name terraform used, for the same adoption reason
  name: weather-app
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: weather-app
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP