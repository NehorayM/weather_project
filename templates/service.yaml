apiVersion: v1
kind: Service
metadata:
  name: weather-app
  namespace: {{ .Release.Namespace }}
  labels:
    app: weather-app     
spec:
  type: {{ .Values.service.type }}
  selector:
    app: weather-app
  ports:
    - name: http     
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.containerPort }}
      protocol: TCP